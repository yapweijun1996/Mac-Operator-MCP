name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:contracts
      - run: npm run verify:canonical:native
      - run: npm audit --audit-level=high
